#workflow 
#should have name
name: Hello
#on tells when the workflow should run 
on:
  workflow_dispatch: 
    

#jobs
#should be inside eorkflow
jobs:
#job tells what thw workflow should do,there can be more than one job hence we write jobs
#job is objevt so it need indentations

  say-hello:
  #say-hello is first job(give indentation)
    runs-on: ubuntu-latest
    #create an ephermal container with ubantu runnung
    #ephermal means only run of shorttime and delete it

    #that ephermal container  will have steps to excute, hence name those steps and run:rub the commnad
    steps:
      - name: Say hello to everyone
      run: echo "hello dosto"
